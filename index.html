<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>qack-maid</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧜</text></svg>" />
<style>
  :root {
    --bg: #ffffff;
    --panel: #f5f5f7;
    --border: #d8d8dc;
    --text: #1a1a1e;
    --muted: #6b6b74;
    --accent: #2f6fed;
    --error-bg: #fdecec;
    --error-border: #e0554f;
    --error-text: #9c1f1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --panel: #1e1e24;
      --border: #33333c;
      --text: #eaeaef;
      --muted: #9a9aa5;
      --accent: #6c9bff;
      --error-bg: #3a1c1c;
      --error-border: #b6473f;
      --error-text: #ff8f88;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header .spacer { flex: 1; }
  select, button {
    font: inherit;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .pane {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .pane[data-pane="source"] { flex: 0 0 var(--split, 50%); }
  .pane[data-pane="preview"] { flex: 1 1 auto; border-left: 1px solid var(--border); }
  #splitter {
    flex: 0 0 6px;
    width: 6px;
    cursor: col-resize;
    background: transparent;
    position: relative;
  }
  #splitter::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 2px;
    width: 2px;
    background: var(--border);
  }
  #splitter:hover::after, #splitter.dragging::after { background: var(--accent); }
  .pane-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    padding: 8px 12px 4px;
  }
  #preview-status {
    text-transform: none;
    letter-spacing: normal;
    color: var(--accent);
    margin-left: 4px;
  }
  textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    line-height: 1.5;
    padding: 8px 12px 16px;
  }
  .preview-wrap {
    flex: 1;
    position: relative;
    overflow: auto;
    background: var(--bg);
  }
  .preview-wrap[data-preview="light"] { background: #ffffff; }
  .preview-wrap[data-preview="dark"] { background: #16161a; }
  #preview {
    padding: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  #preview.zoomed { justify-content: flex-start; }
  #preview.has-error svg { opacity: 0.35; }
  #preview svg { max-width: 100%; height: auto; flex-shrink: 0; }
  #error-banner {
    display: none;
    position: sticky;
    top: 0;
    margin: 8px 12px 0;
    padding: 10px 12px;
    border-radius: 6px;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error-text);
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    z-index: 2;
  }
  #error-banner.show { display: block; }
  #error-banner.jumpable { cursor: pointer; }
  #error-banner.jumpable:hover { border-color: var(--accent); }
  .zoom-controls {
    position: absolute;
    bottom: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 6px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    z-index: 3;
  }
  .zoom-controls button {
    padding: 2px 9px;
    font-size: 14px;
    line-height: 1.4;
  }
  #zoom-level {
    font-size: 11px;
    color: var(--muted);
    min-width: 36px;
    text-align: center;
  }
  .mobile-tabs { display: none; }
  @media (max-width: 720px) {
    .mobile-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .mobile-tabs button {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      border: none;
      border-radius: 0;
      background: var(--panel);
      color: var(--muted);
      box-shadow: none;
    }
    .mobile-tabs button.active {
      color: var(--text);
      background: var(--bg);
      font-weight: 600;
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    main { flex-direction: column; }
    .pane {
      display: none;
    }
    .pane[data-pane="source"] { flex-basis: auto; }
    .pane[data-pane="preview"] { border-left: none; }
    .pane.active-pane { display: flex; }
    #splitter { display: none; }
  }
  #color-row {
    display: none;
    align-items: center;
    gap: 8px;
  }
  #color-row.show { display: flex; }
  #color-row label {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
  }
  #color-row input[type="color"] {
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: none;
    cursor: pointer;
  }
  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 4px 16px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  .powered-by {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-size: 10px;
  }
  .qack-logo {
    display: block;
    width: 63px;
    height: 14px;
    background: var(--text);
    -webkit-mask: var(--qack-logo) no-repeat center / contain;
    mask: var(--qack-logo) no-repeat center / contain;
  }
</style>
</head>
<body>
<header>
  <h1>qack-maid</h1>
  <select id="examples">
    <option value="">Example</option>
    <option value="sequence">Sequence</option>
    <option value="er">ER diagram</option>
    <option value="flowchart">Flowchart</option>
    <option value="class">Class</option>
    <option value="gantt">Gantt</option>
    <option value="state">State</option>
  </select>
  <select id="theme-select">
    <option value="auto">Theme: Auto</option>
    <option value="default">Theme: Default</option>
    <option value="dark">Theme: Dark</option>
    <option value="forest">Theme: Forest</option>
    <option value="neutral">Theme: Neutral</option>
    <option value="custom">Theme: Custom colors</option>
  </select>
  <select id="preview-bg-select">
    <option value="auto">Preview: Auto</option>
    <option value="light">Preview: Light</option>
    <option value="dark">Preview: Dark</option>
  </select>
  <div id="color-row">
    <label>Primary <input type="color" id="color-primary" /></label>
    <label>Text <input type="color" id="color-text" /></label>
    <label>Line <input type="color" id="color-line" /></label>
    <label>Secondary <input type="color" id="color-secondary" /></label>
    <button id="reset-colors" type="button">Reset colors</button>
  </div>
  <div class="spacer"></div>
  <button id="format">Format</button>
  <button id="export-svg">Export SVG</button>
  <button id="export-png">Export PNG</button>
</header>
<div class="mobile-tabs">
  <button type="button" class="tab-btn active" data-pane="source">Source</button>
  <button type="button" class="tab-btn" data-pane="preview">Preview</button>
</div>
<main>
  <div class="pane active-pane" data-pane="source">
    <div class="pane-label">Mermaid source</div>
    <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
  </div>
  <div id="splitter"></div>
  <div class="pane" data-pane="preview">
    <div class="pane-label">Preview <span id="preview-status"></span></div>
    <div class="preview-wrap">
      <div id="error-banner"></div>
      <div id="preview"></div>
    </div>
    <div class="zoom-controls">
      <button id="zoom-out" type="button" title="Zoom out">&minus;</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-in" type="button" title="Zoom in">+</button>
      <button id="zoom-reset" type="button" title="Reset zoom">Fit</button>
    </div>
  </div>
</main>
<footer>
  <span>Offline Mermaid renderer. Autosaves to this browser only — nothing leaves your machine.</span>
  <span class="powered-by">Powered by <span class="qack-logo" role="img" aria-label="QACK Skills"></span></span>
</footer>

<script src="mermaid.min.js"></script>

const QACK_LOGO_RATIO = 215 / 48; // intrinsic width / height
document.documentElement.style.setProperty("--qack-logo", `url("${QACK_LOGO_PNG}")`);

let qackLogoPromise = null;
function loadQackLogo() {
  if (!qackLogoPromise) {
    qackLogoPromise = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = QACK_LOGO_PNG;
    });
  }
  return qackLogoPromise;
}

// Repaints the alpha-only glyph in `color` and returns the canvas. Exports need
// a solid colored copy: SVG <mask> alpha semantics vary across viewers, and a
// black glyph would vanish on a dark background.
function tintedLogoCanvas(logo, heightPx, color) {
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(heightPx * QACK_LOGO_RATIO);
  canvas.height = Math.round(heightPx);
  const ctx = canvas.getContext("2d");
  ctx.drawImage(logo, 0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = "source-in";
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  return canvas;
}

// Geometry for the attribution band appended below an exported diagram, sized
// off the diagram so the stamp stays proportional at any dimension.
function stampMetrics(diagramWidth) {
  const logoHeight = Math.max(11, Math.min(22, diagramWidth * 0.022));
  return {
    logoHeight,
    logoWidth: logoHeight * QACK_LOGO_RATIO,
    fontSize: logoHeight * 0.66,
    gap: logoHeight * 0.45,
    pad: logoHeight * 0.7,
    get bandHeight() {
      return this.logoHeight + this.pad * 2;
    },
  };
}

// The exported stamp mirrors the footer: muted "Powered by" + the glyph, keyed
// to the preview pane's own text color so it reads on either background.
const STAMP_TEXT = "Powered by";
const STAMP_FONT = "system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
const STAMP_ALPHA = 0.65;

// The preview background can be pinned independently of the page theme, so the
// pane's own text color is not a safe contrast reference (a light page with a
// dark-pinned preview yields dark-on-dark). Pick from the background's
// luminance instead.
function stampColor() {
  const bg = getComputedStyle(previewWrapEl).backgroundColor;
  const parts = (bg.match(/[\d.]+/g) || []).slice(0, 3).map(Number);
  if (parts.length < 3) return "#000";
  const [r, g, b] = parts.map((c) => {
    const v = c / 255;
    return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  });
  const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return luminance > 0.4 ? "#000" : "#fff";
}
const sourceEl = document.getElementById("source");
const previewEl = document.getElementById("preview");
const errorEl = document.getElementById("error-banner");
const examplesEl = document.getElementById("examples");
const themeSelectEl = document.getElementById("theme-select");
const colorRowEl = document.getElementById("color-row");
const colorPrimaryEl = document.getElementById("color-primary");
const colorTextEl = document.getElementById("color-text");
const colorLineEl = document.getElementById("color-line");
const colorSecondaryEl = document.getElementById("color-secondary");
const resetColorsEl = document.getElementById("reset-colors");
const previewWrapEl = document.querySelector(".preview-wrap");
const previewBgSelectEl = document.getElementById("preview-bg-select");
const previewStatusEl = document.getElementById("preview-status");

const DEFAULT_CUSTOM_COLORS = {
  primary: "#2f6fed",
  text: "#ffffff",
  line: "#6b6b74",
  secondary: "#e0554f",
};

function loadThemeSettings() {
  try {
    const raw = localStorage.getItem(THEME_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { mode: "auto", colors: DEFAULT_CUSTOM_COLORS };
}

function saveThemeSettings(settings) {
  localStorage.setItem(THEME_KEY, JSON.stringify(settings));
}

let themeSettings = loadThemeSettings();

function applyMermaidTheme() {
  const { mode, colors } = themeSettings;
  if (mode === "custom") {
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        primaryColor: colors.primary,
        primaryTextColor: colors.text,
        lineColor: colors.line,
        secondaryColor: colors.secondary,
      },
    });
  } else if (mode === "auto") {
    mermaid.initialize({
      startOnLoad: false,
      theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default",
    });
  } else {
    mermaid.initialize({ startOnLoad: false, theme: mode });
  }
}

function syncThemeUI() {
  themeSelectEl.value = themeSettings.mode;
  colorRowEl.classList.toggle("show", themeSettings.mode === "custom");
  const c = { ...DEFAULT_CUSTOM_COLORS, ...themeSettings.colors };
  colorPrimaryEl.value = c.primary;
  colorTextEl.value = c.text;
  colorLineEl.value = c.line;
  colorSecondaryEl.value = c.secondary;
}

syncThemeUI();
applyMermaidTheme();

themeSelectEl.addEventListener("change", () => {
  themeSettings.mode = themeSelectEl.value;
  saveThemeSettings(themeSettings);
  syncThemeUI();
  applyMermaidTheme();
  render();
});

[colorPrimaryEl, colorTextEl, colorLineEl, colorSecondaryEl].forEach((el) => {
  el.addEventListener("input", () => {
    themeSettings.colors = {
      primary: colorPrimaryEl.value,
      text: colorTextEl.value,
      line: colorLineEl.value,
      secondary: colorSecondaryEl.value,
    };
    saveThemeSettings(themeSettings);
    applyMermaidTheme();
    render();
  });
});

resetColorsEl.addEventListener("click", () => {
  themeSettings.colors = { ...DEFAULT_CUSTOM_COLORS };
  saveThemeSettings(themeSettings);
  syncThemeUI();
  applyMermaidTheme();
  render();
});

let previewBg = localStorage.getItem(PREVIEW_BG_KEY) || "auto";

function applyPreviewBg() {
  if (previewBg === "auto") {
    previewWrapEl.removeAttribute("data-preview");
  } else {
    previewWrapEl.setAttribute("data-preview", previewBg);
  }
}

previewBgSelectEl.value = previewBg;
applyPreviewBg();

previewBgSelectEl.addEventListener("change", () => {
  previewBg = previewBgSelectEl.value;
  localStorage.setItem(PREVIEW_BG_KEY, previewBg);
  applyPreviewBg();
});

const EXAMPLES = {
  sequence: `sequenceDiagram
    participant A as Client
    participant B as Server
    A->>B: Request
    B-->>A: Response`,
  er: `erDiagram
    CUSTOMER ||--o{ ORDER : places
    ORDER ||--|{ LINE_ITEM : contains
    CUSTOMER {
        string name
        string email
    }`,
  flowchart: `flowchart TD
    A[Start] --> B{Decision}
    B -->|Yes| C[Do thing]
    B -->|No| D[Skip]
    C --> E[End]
    D --> E`,
  class: `classDiagram
    class Animal {
      +String name
      +move()
    }
    class Dog {
      +bark()
    }
    Animal <|-- Dog`,
  gantt: `gantt
    title Project
    dateFormat  YYYY-MM-DD
    section Phase 1
    Task A :a1, 2026-01-01, 5d
    Task B :after a1, 3d`,
  state: `stateDiagram-v2
    [*] --> Idle
    Idle --> Running : start
    Running --> Idle : stop
    Running --> [*]`,
};

let renderSeq = 0;

async function render() {
  const code = sourceEl.value.trim();
  localStorage.setItem(STORAGE_KEY, sourceEl.value);
  if (!code) {
    previewEl.innerHTML = "";
    previewEl.classList.remove("has-error");
    errorEl.classList.remove("show", "jumpable");
    previewStatusEl.textContent = "";
    return;
  }
  previewStatusEl.textContent = "Rendering…";
  const id = "graph-" + (++renderSeq);
  try {
    const { svg } = await mermaid.render(id, code);
    previewEl.innerHTML = svg;
    previewEl.classList.remove("has-error");
    errorEl.classList.remove("show", "jumpable");
    applyZoom();
  } catch (err) {
    previewEl.classList.add("has-error");
    const message = (err && err.message) ? err.message : String(err);
    errorEl.textContent = message;
    errorEl.classList.add("show");
    const lineMatch = message.match(/line\s+(\d+)/i);
    if (lineMatch) {
      errorEl.dataset.line = lineMatch[1];
      errorEl.classList.add("jumpable");
      errorEl.title = "Click to jump to line " + lineMatch[1];
    } else {
      delete errorEl.dataset.line;
      errorEl.classList.remove("jumpable");
      errorEl.title = "";
    }
    // remove any stray error DOM mermaid injects outside #preview
    document.querySelectorAll('[id^="dqueue-"], [id^="d' + id + '"]').forEach(n => n.remove());
  } finally {
    previewStatusEl.textContent = "";
  }
}

function jumpToLine(lineNum) {
  const lines = sourceEl.value.split("\n");
  let charIndex = 0;
  for (let i = 0; i < lineNum - 1 && i < lines.length; i++) charIndex += lines[i].length + 1;
  const lineText = lines[lineNum - 1] || "";
  sourceEl.focus();
  sourceEl.setSelectionRange(charIndex, charIndex + lineText.length);
  const lineHeight = 13 * 1.5;
  sourceEl.scrollTop = Math.max(0, (lineNum - 1) * lineHeight - sourceEl.clientHeight / 2);
}

errorEl.addEventListener("click", () => {
  const line = errorEl.dataset.line;
  if (!line) return;
  jumpToLine(parseInt(line, 10));
});

let debounceTimer;
sourceEl.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 250);
});

document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (!mod) return;
  if (e.key === "Enter") {
    e.preventDefault();
    clearTimeout(debounceTimer);
    render();
  } else if (e.key.toLowerCase() === "s") {
    e.preventDefault();
    document.getElementById("export-svg").click();
  }
});

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".pane").forEach((p) => p.classList.remove("active-pane"));
    document.querySelector('.pane[data-pane="' + btn.dataset.pane + '"]').classList.add("active-pane");
  });
});

let zoomLevel = 1;
const zoomLevelEl = document.getElementById("zoom-level");
function applyZoom() {
  const svg = previewEl.querySelector("svg");
  if (svg) {
    // cache the natural (unzoomed, container-fit) size once per rendered svg
    if (!svg.dataset.baseWidth) {
      // measure while still constrained by max-width:100%, so 100% zoom == fit-to-pane
      const rect = svg.getBoundingClientRect();
      svg.dataset.baseWidth = rect.width;
      svg.dataset.baseHeight = rect.height;
      svg.style.maxWidth = "none";
    }
    svg.style.width = (parseFloat(svg.dataset.baseWidth) * zoomLevel) + "px";
    svg.style.height = (parseFloat(svg.dataset.baseHeight) * zoomLevel) + "px";
  }
  previewEl.classList.toggle("zoomed", zoomLevel !== 1);
  zoomLevelEl.textContent = Math.round(zoomLevel * 100) + "%";
}
document.getElementById("zoom-in").addEventListener("click", () => {
  zoomLevel = Math.min(3, +(zoomLevel + 0.15).toFixed(2));
  applyZoom();
});
document.getElementById("zoom-out").addEventListener("click", () => {
  zoomLevel = Math.max(0.25, +(zoomLevel - 0.15).toFixed(2));
  applyZoom();
});
document.getElementById("zoom-reset").addEventListener("click", () => {
  zoomLevel = 1;
  applyZoom();
});
previewWrapEl.addEventListener("wheel", (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  zoomLevel = Math.min(3, Math.max(0.25, +(zoomLevel + (e.deltaY < 0 ? 0.1 : -0.1)).toFixed(2)));
  applyZoom();
}, { passive: false });

const mainEl = document.querySelector("main");
const splitterEl = document.getElementById("splitter");
const sourcePaneEl = document.querySelector('.pane[data-pane="source"]');

function applySplit(pct) {
  mainEl.style.setProperty("--split", pct + "%");
}

const savedSplit = parseFloat(localStorage.getItem(SPLIT_KEY));
applySplit(Number.isFinite(savedSplit) ? savedSplit : 50);

splitterEl.addEventListener("mousedown", (e) => {
  e.preventDefault();
  splitterEl.classList.add("dragging");
  document.body.style.userSelect = "none";
  const onMove = (moveEvent) => {
    const rect = mainEl.getBoundingClientRect();
    let pct = ((moveEvent.clientX - rect.left) / rect.width) * 100;
    pct = Math.min(80, Math.max(20, pct));
    applySplit(pct);
  };
  const onUp = () => {
    splitterEl.classList.remove("dragging");
    document.body.style.userSelect = "";
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    const pct = parseFloat(mainEl.style.getPropertyValue("--split"));
    if (Number.isFinite(pct)) localStorage.setItem(SPLIT_KEY, pct);
  };
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
});

splitterEl.addEventListener("dblclick", () => {
  applySplit(50);
  localStorage.setItem(SPLIT_KEY, 50);
});

examplesEl.addEventListener("change", () => {
  const key = examplesEl.value;
  if (!key) return;
  sourceEl.value = EXAMPLES[key];
  examplesEl.value = "";
  render();
});

function formatMermaid(code) {
  const lines = code
    .split("\n")
    .map((l) => l.trim())
    .filter((l) => l !== ""); // drop all blank lines
  if (!lines.length) return "";

  const out = [lines[0]]; // diagram-type declaration stays at indent 0
  let depth = 1;
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("}")) depth = Math.max(1, depth - 1);
    out.push("    ".repeat(depth) + line);
    if (line.endsWith("{")) depth += 1;
  }
  return out.join("\n");
}

document.getElementById("format").addEventListener("click", () => {
  sourceEl.value = formatMermaid(sourceEl.value);
  render();
});

document.getElementById("export-svg").addEventListener("click", async () => {
  const svg = previewEl.querySelector("svg");
  if (!svg) return;
  const copy = svg.cloneNode(true);
  // The live SVG carries the preview pane's zoom as inline px width/height. Left
  // in place they fight the stamped viewBox and export a stretched diagram.
  copy.style.removeProperty("width");
  copy.style.removeProperty("height");
  copy.style.removeProperty("max-width");
  delete copy.dataset.baseWidth;
  delete copy.dataset.baseHeight;
  try {
    await appendStampToSvg(copy, svg);
  } catch {
    // A failed stamp must not cost the user their export.
  }
  // Must be XMLSerializer, not outerHTML: the HTML serializer leaves Mermaid's
  // <br> in labels unclosed and omits the xmlns:xlink declaration the stamp
  // needs, either of which makes the downloaded file unparseable as SVG.
  const markup = new XMLSerializer().serializeToString(copy);
  const blob = new Blob([markup], { type: "image/svg+xml;charset=utf-8" });
  downloadBlob(blob, "diagram.svg");
});

// Grows the exported SVG by a band at the bottom and draws the attribution into
// it, so the stamp never overlaps diagram content.
async function appendStampToSvg(copy, svg) {
  const box = svg.viewBox?.baseVal;
  const width = box?.width || svg.getBoundingClientRect().width;
  const height = box?.height || svg.getBoundingClientRect().height;
  if (!width || !height) return;
  const x = box?.x || 0;
  const y = box?.y || 0;
  const m = stampMetrics(width);
  const color = stampColor();

  copy.setAttribute("viewBox", `${x} ${y} ${width} ${height + m.bandHeight}`);
  copy.setAttribute("width", width);
  copy.setAttribute("height", height + m.bandHeight);
  // Mermaid pins an inline style height on the root, which outranks the height
  // attribute in any CSS-aware viewer and would squash the taller viewBox.
  copy.style.height = `${height + m.bandHeight}px`;

  const baseline = y + height + m.pad + m.logoHeight * 0.78;
  const logoX = x + width - m.pad - m.logoWidth;

  const text = document.createElementNS(SVG_NS, "text");
  text.setAttribute("x", logoX - m.gap);
  text.setAttribute("y", baseline);
  text.setAttribute("text-anchor", "end");
  text.setAttribute("font-family", STAMP_FONT);
  text.setAttribute("font-size", m.fontSize);
  text.setAttribute("fill", color);
  text.setAttribute("fill-opacity", STAMP_ALPHA);
  text.textContent = STAMP_TEXT;

  const logo = await loadQackLogo();
  const image = document.createElementNS(SVG_NS, "image");
  image.setAttribute("x", logoX);
  image.setAttribute("y", y + height + m.pad);
  image.setAttribute("width", m.logoWidth);
  image.setAttribute("height", m.logoHeight);
  image.setAttribute("opacity", STAMP_ALPHA);
  const logoData = tintedLogoCanvas(logo, m.logoHeight * 4, color).toDataURL("image/png");
  image.setAttribute("href", logoData);
  // xlink:href as well, for viewers predating SVG 2.
  image.setAttributeNS("http://www.w3.org/1999/xlink", "href", logoData);

  copy.appendChild(text);
  copy.appendChild(image);
}

const SVG_NS = "http://www.w3.org/2000/svg";

// Recursively copies text nodes and b/strong/i/em formatting from an HTML
// fragment into nested SVG <tspan>s, preserving bold/italic runs.
function appendFormattedRuns(sourceNode, target) {
  sourceNode.childNodes.forEach((node) => {
    if (node.nodeType === Node.TEXT_NODE) {
      target.appendChild(document.createTextNode(node.textContent));
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    const tag = node.tagName.toLowerCase();
    const inner = document.createElementNS(SVG_NS, "tspan");
    if (tag === "b" || tag === "strong") inner.setAttribute("font-weight", "bold");
    if (tag === "i" || tag === "em") inner.setAttribute("font-style", "italic");
    appendFormattedRuns(node, inner);
    target.appendChild(inner);
  });
}

// Chrome/Firefox/Safari taint any canvas rasterized from an SVG that contains
// <foreignObject> (Mermaid uses it for every text label), regardless of origin.
// Replace each foreignObject label with an equivalent SVG <text> before export.
function flattenLabelsForExport(svg) {
  const clone = svg.cloneNode(true);
  const origFos = Array.from(svg.querySelectorAll("foreignObject"));
  const cloneFos = Array.from(clone.querySelectorAll("foreignObject"));
  origFos.forEach((fo, i) => {
    const div = fo.querySelector("div");
    const cloneFo = cloneFos[i];
    if (!div || !cloneFo) return;
    const pElements = Array.from(div.querySelectorAll("p"));
    let lineHtmls = [];
    if (pElements.length) {
      // Mermaid puts explicit line breaks as <br> inside a single <p>, not separate <p>s.
      pElements.forEach((p) => {
        lineHtmls.push(...p.innerHTML.split(/<br\s*\/?>/i));
      });
    } else {
      lineHtmls = [div.innerHTML];
    }
    if (!div.textContent.trim()) {
      cloneFo.remove();
      return;
    }
    const cs = getComputedStyle(div);
    const fontSize = parseFloat(cs.fontSize) || 16;
    const lineHeight = parseFloat(cs.lineHeight) || fontSize * 1.5;
    const width = parseFloat(fo.getAttribute("width")) || 0;
    const textAnchor = cs.textAlign === "left" ? "start" : cs.textAlign === "right" ? "end" : "middle";
    const x = textAnchor === "middle" ? width / 2 : textAnchor === "end" ? width : 0;
    const textEl = document.createElementNS(SVG_NS, "text");
    // Strip quotes from font-family: quoted family names survive live DOM/inline SVG
    // rendering fine, but break font resolution when this SVG is rasterized via an
    // <img>/canvas pipeline, silently falling back to a default cursive-ish font.
    textEl.setAttribute("font-family", cs.fontFamily.replace(/"/g, ""));
    textEl.setAttribute("font-size", fontSize);
    textEl.setAttribute("fill", cs.color);
    lineHtmls.forEach((lineHtml, idx) => {
      const lineTspan = document.createElementNS(SVG_NS, "tspan");
      lineTspan.setAttribute("x", x);
      lineTspan.setAttribute("y", idx * lineHeight + lineHeight * 0.7);
      lineTspan.setAttribute("text-anchor", textAnchor);
      const tmp = document.createElement("div");
      tmp.innerHTML = lineHtml;
      appendFormattedRuns(tmp, lineTspan);
      textEl.appendChild(lineTspan);
    });
    cloneFo.replaceWith(textEl);
  });
  return clone;
}

document.getElementById("export-png").addEventListener("click", () => {
  const svg = previewEl.querySelector("svg");
  if (!svg) return;
  const flatSvg = flattenLabelsForExport(svg);
  const bbox = svg.getBoundingClientRect();
  const pxWidth = svg.viewBox?.baseVal?.width || bbox.width;
  const pxHeight = svg.viewBox?.baseVal?.height || bbox.height;
  // The live SVG's root width="100%" has no matching height attribute, so a
  // detached copy (as used for the <img> below) has no way to resolve its own
  // intrinsic size and falls back to a 300x150 default box, aspect-fit from the
  // viewBox. That rasterizes the whole diagram at a fraction of its real size,
  // which then gets stretched blurry back up — looks like a broken/blurred font
  // and truncates content when drawn into the full-size canvas. Pin explicit
  // pixel dimensions so the detached SVG resolves to its real size.
  flatSvg.setAttribute("width", pxWidth);
  flatSvg.setAttribute("height", pxHeight);
  const svgData = new XMLSerializer().serializeToString(flatSvg);
  const img = new Image();
  const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(svgBlob);
  img.onload = async () => {
    const scale = 2; // export at 2x for crispness
    const m = stampMetrics(pxWidth);
    const canvas = document.createElement("canvas");
    canvas.width = pxWidth * scale;
    canvas.height = (pxHeight + m.bandHeight) * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = getComputedStyle(previewWrapEl).backgroundColor || "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, pxWidth * scale, pxHeight * scale);
    URL.revokeObjectURL(url);
    try {
      await drawStampOnCanvas(ctx, canvas.width, pxHeight * scale, m, scale);
    } catch {
      // A failed stamp must not cost the user their export.
    }
    canvas.toBlob((blob) => downloadBlob(blob, "diagram.png"));
  };
  img.src = url;
});

// Draws the attribution into the band reserved below the rasterized diagram.
async function drawStampOnCanvas(ctx, canvasWidth, diagramBottom, m, scale) {
  const logo = await loadQackLogo();
  const color = stampColor();
  const logoHeight = m.logoHeight * scale;
  const logoWidth = m.logoWidth * scale;
  const pad = m.pad * scale;
  const logoX = canvasWidth - pad - logoWidth;
  const logoY = diagramBottom + pad;

  ctx.save();
  ctx.globalAlpha = STAMP_ALPHA;
  ctx.font = `${m.fontSize * scale}px ${STAMP_FONT}`;
  ctx.fillStyle = color;
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  ctx.fillText(STAMP_TEXT, logoX - m.gap * scale, logoY + logoHeight / 2);
  ctx.drawImage(
    tintedLogoCanvas(logo, logoHeight * 2, color),
    logoX,
    logoY,
    logoWidth,
    logoHeight,
  );
  ctx.restore();
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// restore autosaved source, else load a default example
const saved = localStorage.getItem(STORAGE_KEY);
sourceEl.value = saved !== null && saved !== "" ? saved : EXAMPLES.flowchart;
render();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>qack-maid</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧜</text></svg>" />
<link rel="stylesheet" href="css/app.css" />
<link rel="stylesheet" href="css/menu.css" />
<link rel="stylesheet" href="css/presentation.css" />
<link rel="stylesheet" href="css/chrome.css" />
<link rel="stylesheet" href="css/diagrams.css" />
</head>
<body>
<header>
  <h1>QACK <span class="accent">MAID</span></h1>
  <div class="menu picker" id="theme-menu">
    <button type="button" class="menu-trigger" id="theme-trigger" aria-haspopup="menu" aria-expanded="false">Theme: <span class="picker-value">Auto</span><span class="caret" aria-hidden="true"></span></button>
    <div class="menu-list" role="menu" aria-label="Diagram theme">
      <button type="button" role="menuitemradio" aria-checked="true" data-value="auto">Auto</button>
      <button type="button" role="menuitemradio" aria-checked="false" data-value="default">Default</button>
      <button type="button" role="menuitemradio" aria-checked="false" data-value="dark">Dark</button>
      <button type="button" role="menuitemradio" aria-checked="false" data-value="forest">Forest</button>
      <button type="button" role="menuitemradio" aria-checked="false" data-value="neutral">Neutral</button>
      <div class="menu-divider" role="separator"></div>
      <button type="button" role="menuitemradio" aria-checked="false" data-value="custom">Custom colors</button>
    </div>
  </div>
  <div class="menu picker" id="preview-bg-menu">
    <button type="button" class="menu-trigger" id="preview-bg-trigger" aria-haspopup="menu" aria-expanded="false">Preview: <span class="picker-value">Auto</span><span class="caret" aria-hidden="true"></span></button>
    <div class="menu-list" role="menu" aria-label="Preview background">
      <button type="button" role="menuitemradio" aria-checked="true" data-value="auto">Auto</button>
      <button type="button" role="menuitemradio" aria-checked="false" data-value="light">Light</button>
      <button type="button" role="menuitemradio" aria-checked="false" data-value="dark">Dark</button>
    </div>
  </div>
  <div id="color-row">
    <label>Primary <input type="color" id="color-primary" /></label>
    <label>Text <input type="color" id="color-text" /></label>
    <label>Line <input type="color" id="color-line" /></label>
    <label>Secondary <input type="color" id="color-secondary" /></label>
    <button id="reset-colors" type="button">Reset colors</button>
  </div>
  <div class="spacer"></div>
  <button id="format">Format</button>
  <div class="menu" id="export-menu">
    <button type="button" class="menu-trigger" id="export-trigger" aria-haspopup="menu" aria-expanded="false">Export<span class="caret" aria-hidden="true"></span></button>
    <div class="menu-list" role="menu" aria-labelledby="export-trigger">
      <div class="menu-group">Download</div>
      <button type="button" role="menuitem" data-export="download-png">PNG file<span class="hint" id="png-shortcut"></span></button>
      <div class="menu-group">Copy to clipboard</div>
      <button type="button" role="menuitem" data-export="copy-png">PNG image</button>
    </div>
  </div>
  <button id="present" type="button">Present</button>
</header>
<div class="mobile-tabs">
  <button type="button" class="tab-btn" data-pane="diagrams">Diagrams</button>
  <button type="button" class="tab-btn active" data-pane="source">Source</button>
  <button type="button" class="tab-btn" data-pane="preview">Preview</button>
</div>
<div class="workspace">
<aside id="diagram-list" class="pane" data-pane="diagrams">
  <div class="pane-label">Diagrams <button id="diagram-collapse" type="button" aria-expanded="true" title="Collapse">«</button></div>
  <button id="diagram-new" type="button">+ New</button>
  <ul id="diagram-items"></ul>
</aside>
<main>
  <div class="pane active-pane" data-pane="source">
    <div class="pane-label">Mermaid source</div>
    <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
  </div>
  <div id="splitter"></div>
  <div class="pane" data-pane="preview">
    <div class="pane-label">Preview <span id="preview-status"></span></div>
    <div class="preview-wrap">
      <div id="error-banner"></div>
      <div id="preview"></div>
      <div id="presentation-toolbar" class="presentation-toolbar">
        <button id="tool-pointer" type="button" class="presentation-tool" aria-pressed="true" title="Pointer">Pointer</button>
        <button id="tool-laser" type="button" class="presentation-tool" aria-pressed="false" title="Laser">Laser</button>
        <input id="laser-color" type="color" title="Laser color" aria-label="Laser color" value="#dc2626" />
        <button id="presentation-exit" type="button" title="Esc">Exit presentation</button>
      </div>
    </div>
    <div class="zoom-controls">
      <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 8h9"/></svg></button>
      <span id="zoom-level" aria-live="polite">100%</span>
      <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
      <span class="zoom-divider" aria-hidden="true"></span>
      <button id="zoom-reset" type="button" title="Reset zoom">Fit</button>
    </div>
  </div>
</main>
</div>
<footer>
  <span>Offline Mermaid renderer. Autosaves to this browser only — nothing leaves your machine.</span>
  <span class="powered-by">Powered by <span class="qack-logo" role="img" aria-label="QACK Skills"></span></span>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script src="mermaid.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/logo.js"></script>
<script src="js/theme.js"></script>
<script src="js/render.js"></script>
<script src="js/diagrams/names.js"></script>
<script src="js/diagrams/store.js"></script>
<script src="js/diagrams/session.js"></script>
<script src="js/editor.js"></script>
<script src="js/zoom-pan.js"></script>
<script src="js/presentation/mode.js"></script>
<script src="js/presentation/laser.js"></script>
<script src="js/presentation/spotlight.js"></script>
<script src="js/export/stamp.js"></script>
<script src="js/export/png.js"></script>
<script src="js/export/menu.js"></script>
<script src="js/diagrams/sidebar.js"></script>
<script src="js/main.js"></script>
</body>
</html>
